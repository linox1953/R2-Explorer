name = "r2-drive-explorer"
compatibility_date = "2024-11-06"
main = "src/index.ts"

assets = { directory = "packages/dashboard/dist/spa", binding = "ASSETS", html_handling = "auto-trailing-slash", not_found_handling = "single-page-application", run_worker_first = ["/api/*", "/share/*"] }

workers_dev = false
routes = [
  { pattern = "drive.doublehighc.top", custom_domain = true }
]

[[r2_buckets]]
binding = 'drive'
bucket_name = 'drive'
preview_bucket_name = 'drive'
